name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Builds packages/shared first so apps typecheck against its emitted .d.ts files.
      - name: Typecheck all workspaces
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planning_poker
          POSTGRES_PASSWORD: planning_poker
          POSTGRES_DB: planning_poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planning_poker -d planning_poker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://planning_poker:planning_poker@localhost:5432/planning_poker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # The room flow is a browser talking to the real API and database, so this job needs
    # Postgres too; Playwright starts both servers itself (apps/web/playwright.config.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planning_poker
          POSTGRES_PASSWORD: planning_poker
          POSTGRES_DB: planning_poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planning_poker -d planning_poker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://planning_poker:planning_poker@localhost:5432/planning_poker
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Apply database migrations
        run: npm run migrate --workspace @planning-poker/api
      - name: Build API
        run: npm run build --workspace @planning-poker/api
      - name: Build web app
        run: npm run build --workspace @planning-poker/web
      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace @planning-poker/web
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
