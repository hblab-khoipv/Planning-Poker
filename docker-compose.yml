services:
  postgres:
    image: postgres:16-alpine
    container_name: planning-poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planning_poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planning_poker}
      POSTGRES_DB: ${POSTGRES_DB:-planning_poker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-planning_poker} -d ${POSTGRES_DB:-planning_poker}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
